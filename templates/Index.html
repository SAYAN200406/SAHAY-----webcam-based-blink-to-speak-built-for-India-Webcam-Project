<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAHAY - Head-Controlled Assistive Interface</title>

    <!-- Flask serves CSS from the static folder -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='Css.css') }}">
</head>

<body>

    <!-- NAV -->
    <div id="nav">

        <img src="{{ url_for('static', filename='mods.jpg') }}"
             height="40"
             >

        <span id="nav1">
            
        </span>

    </div>


    <!-- HEADER -->
    <header id="navber">

        <div id="logo">
            SAHAY
        </div>

        <div id="tracking1">

            <div id="fpsDisplay">0</div>

            <div id="tracking">
                <span class="dot" id="statusDot">&#9679;</span>
                <span id="statusText">Tracking inactive</span>
            </div>

        </div>

    </header>


    <!-- TRACKING CONTROLS -->
    <div id="controls">

        <button id="start">
            START TRACKING
        </button>

        <button id="stop">
            STOP TRACKING
        </button>

    </div>


    <!-- MAIN CONTENT -->
    <main id="container">

        <div id="board">

            <b>COMMUNICATION BOARD</b>

            <span id="dot">.</span>

            <span>
                look at a button and hold your gaze to select
            </span>

        </div>


        <section id="communicationboard">

            <!-- YES -->
            <button class="icon-div" id="first" onclick="voiceClick('YES')">

                <div id="icon1">
                    &#10004;
                </div>

                <div id="text">
                    <p>YES</p>
                </div>

            </button>


            <!-- NO -->
            <button class="icon-div" id="second" onclick="voiceClick('NO')">

                <div id="icon1">
                    &#10060;
                </div>

                <div id="text">
                    <p>NO</p>
                </div>

            </button>


            <!-- WATER -->
            <button class="icon-div" id="theird" onclick="voiceClick('WATER')">

                <div id="icon1">
                    &#x1F4A7;
                </div>

                <div id="text">
                    <p>I NEED WATER</p>
                </div>

            </button>


            <!-- BATHROOM -->
            <button class="icon-div" id="forth" onclick="voiceClick('BATHROOM')">

                <div id="icon1">
                    &#x1F6BD;
                </div>

                <div id="text">
                    <p>BATHROOM / TOILET</p>
                </div>

            </button>


            <!-- FOOD -->
            <button class="icon-div" id="fifth" onclick="voiceClick('FOOD')">

                <div id="icon1">
                    &#127860;
                </div>

                <div id="text">
                    <p>I NEED FOOD</p>
                </div>

            </button>


            <!-- REPOSITION -->
            <button class="icon-div" id="six" onclick="voiceClick('REPOSITION')">

                <div id="icon1">
                    <b>&#8634;</b>
                </div>

                <div id="text">
                    <p>REPOSITION ME</p>
                </div>

            </button>


            <!-- HELP -->
            <button class="icon-div" id="seventh" onclick="voiceClick('HELP')">

                <div id="icon1">
                    &#x270B;
                </div>

                <div id="text">
                    <p>I NEED HELP</p>
                </div>

            </button>


            <!-- CAREGIVER -->
            <button class="icon-div" id="eight" onclick="voiceClick('CAREGIVER')" >

                <div id="icon1">
                    &#128222;
                </div>

                <div id="text">
                    <p>CALL CAREGIVER</p>
                </div>

            </button>


            <!-- EMERGENCY -->
            <button class="icon-div" id="nine" onclick="voiceClick('EMERGENCY')" >

                <div id="icon1">
                    &#9888;
                </div>

                <div id="text">
                    <p>EMERGENCY</p>
                </div>

            </button>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>
        Hands-free control via webcam head tracking -- SAHAY BY (SAYAN~SAMRAT~SOUMYADEEP)
    </footer>


    <!-- FLASK + PYTHON CONNECTION -->
    <script>

        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");

        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");


        // START TRACKING
        startButton.addEventListener("click", async () => {

            try {

                statusText.textContent = "Starting...";

                const response = await fetch("/start", {
                    method: "POST"
                });

                const data = await response.json();

                statusText.textContent = data.message;

                if (data.status === "started" ||
                    data.status === "already_running") {

                    statusDot.style.color = "green";

                }

            } catch (error) {

                console.error(error);

                statusText.textContent =
                    "Unable to start tracking";

                statusDot.style.color = "red";

            }

        });


        // STOP TRACKING
        stopButton.addEventListener("click", async () => {

            try {

                const response = await fetch("/stop", {
                    method: "POST"
                });

                const data = await response.json();

                statusText.textContent = data.message;

                statusDot.style.color = "red";

            } catch (error) {

                console.error(error);

                statusText.textContent =
                    "Unable to stop tracking";

            }

        });


        // CHECK TRACKING STATUS
        async function checkStatus() {

            try {

                const response = await fetch("/status");

                const data = await response.json();

                if (data.running) {

                    statusText.textContent =
                        "Tracking active";

                    statusDot.style.color = "green";

                } else {

                    statusText.textContent =
                        "Tracking inactive";

                    statusDot.style.color = "red";

                }

            } catch (error) {

                console.error(error);

            }

        }


        // Check when page loads
        checkStatus();
        //voice making transcription
        function speak(text) {
    const voice = new SpeechSynthesisUtterance(text);
    voice.rate = 1;
    voice.volume = 1;
    window.speechSynthesis.speak(voice);
}

function voiceClick(buttonName) {
    speak(buttonName + " clicked");
}


        // ============================================================
        // AUTO-SCROLL -- so the patient never needs a mouse/keyboard
        // to reach buttons below the fold.
        //
        // pyautogui.moveTo() in Eye_As_Mouse.py moves the REAL OS
        // cursor, so the browser already receives genuine mousemove
        // events while tracking is active. We just watch those events
        // and scroll the page when the cursor nears the top/bottom
        // edge of the visible window.
        // ============================================================

        const SCROLL_EDGE_ZONE = 100;   // px from top/bottom edge that triggers scrolling
        const SCROLL_SPEED = 10;        // px moved per mousemove tick
        const CLICK_PAUSE_MS = 1000;    // pause scrolling for a moment after a click

        let scrollPaused = false;
        let clickPauseTimer = null;

        function pauseScrollBriefly(duration = CLICK_PAUSE_MS) {
            scrollPaused = true;
            clearTimeout(clickPauseTimer);
            clickPauseTimer = setTimeout(() => {
                scrollPaused = false;
            }, duration);
        }

        document.addEventListener("mousemove", (e) => {

            if (scrollPaused) return;

            const y = e.clientY;
            const viewportHeight = window.innerHeight;

            if (y < SCROLL_EDGE_ZONE) {
                // Cursor near top edge -- scroll up
                window.scrollBy(0, -SCROLL_SPEED);
            } else if (y > viewportHeight - SCROLL_EDGE_ZONE) {
                // Cursor near bottom edge -- scroll down
                window.scrollBy(0, SCROLL_SPEED);
            }

        });

        // Pause auto-scroll the instant the cursor lands on a button,
        // so the page doesn't drift away mid-selection.
        document.querySelectorAll(".icon-div").forEach((btn) => {

            btn.addEventListener("mouseenter", () => {
                scrollPaused = true;
                clearTimeout(clickPauseTimer);
            });

            btn.addEventListener("mouseleave", () => {
                scrollPaused = false;
            });

            // Also hold the pause for a moment after an actual click,
            // so a fresh blink-click isn't immediately followed by
            // the page jumping underneath the patient.
            btn.addEventListener("click", () => {
                pauseScrollBriefly();
            });

        });

    </script>

</body>

</html>
